services:
  api1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet_api_1
    ports:
      - "2504:8080"
    environment:
      - API_INSTANCE_NAME=Instance 1

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dotnet_api_2
    ports:
      - "2514:8080"
    environment:
      - API_INSTANCE_NAME=Instance 2

  nginx:
    image: nginx:alpine
    container_name: nginx_load_balancer
    ports:
      - "2524:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api1
      - api2
